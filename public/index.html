<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Inglês Acelerado</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: colorful hero for the current level (an everyday setting), then five level bands, each with four skill cards; lessons open full screen in the skill's color. */
:root{
  --bg:#F5F3FA; --surface:#FFFFFF; --surface-2:#F4F2F9; --ink:#17142B; --muted:#5F5A78; --line:#E2DEEE;
  --accent:#6A3CF5; --accent-ink:#FFFFFF; --accent-soft:#ECE6FF;
  --gold:#E09A12; --gold-soft:#FFF1D6;
  --good:#12A066; --good-soft:#DDF6EA; --bad:#E0413A; --bad-soft:#FDE4E2;
  --c-read:#2F6BFF; --c-read-soft:#E5EDFF; --c-write:#8A3FFC; --c-write-soft:#F0E6FF;
  --c-listen:#FF7A1A; --c-listen-soft:#FFEEDD; --c-speak:#00A87E; --c-speak-soft:#DBF5EC;
  --blob1:rgba(255,122,26,.14); --blob2:rgba(138,63,252,.13); --blob3:rgba(0,168,126,.11);
  --shadow:0 1px 2px rgba(23,20,43,.06),0 10px 28px rgba(23,20,43,.08);
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F0D1C; --surface:#1A1730; --surface-2:#221E3C; --ink:#EEEBFA; --muted:#A49EC2; --line:#2F2A4D;
  --accent:#9B7BFF; --accent-ink:#0F0D1C; --accent-soft:#2A2250;
  --gold:#FFC04D; --gold-soft:#3A2C12;
  --good:#37D394; --good-soft:#123426; --bad:#FF6B63; --bad-soft:#3E1A1C;
  --c-read:#6E95FF; --c-read-soft:#18244E; --c-write:#B184FF; --c-write-soft:#2A1C4A;
  --c-listen:#FF9A4D; --c-listen-soft:#3C2613; --c-speak:#34D3A4; --c-speak-soft:#10352B;
  --blob1:rgba(255,122,26,.10); --blob2:rgba(138,63,252,.16); --blob3:rgba(0,168,126,.09);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F0D1C; --surface:#1A1730; --surface-2:#221E3C; --ink:#EEEBFA; --muted:#A49EC2; --line:#2F2A4D;
  --accent:#9B7BFF; --accent-ink:#0F0D1C; --accent-soft:#2A2250;
  --gold:#FFC04D; --gold-soft:#3A2C12;
  --good:#37D394; --good-soft:#123426; --bad:#FF6B63; --bad-soft:#3E1A1C;
  --c-read:#6E95FF; --c-read-soft:#18244E; --c-write:#B184FF; --c-write-soft:#2A1C4A;
  --c-listen:#FF9A4D; --c-listen-soft:#3C2613; --c-speak:#34D3A4; --c-speak-soft:#10352B;
  --blob1:rgba(255,122,26,.10); --blob2:rgba(138,63,252,.16); --blob3:rgba(0,168,126,.09);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.4); color-scheme:dark}

/* one gradient per setting (same in both themes: white text sits on it) */
.env-0{--env:linear-gradient(125deg,#FF8A3D 0%,#FF4F7B 100%);--env-solid:#FF5F6A}
.env-1{--env:linear-gradient(125deg,#FF4FA3 0%,#8A3FFC 100%);--env-solid:#C046D6}
.env-2{--env:linear-gradient(125deg,#E8364F 0%,#FF9F1C 100%);--env-solid:#F0623A}
.env-3{--env:linear-gradient(125deg,#06B6C9 0%,#1FB863 100%);--env-solid:#0FB497}
.env-4{--env:linear-gradient(125deg,#2F6BFF 0%,#4B2FC0 100%);--env-solid:#3D4FE0}

*{box-sizing:border-box}
html,body{min-height:100%}
body{color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  background:
   radial-gradient(600px 420px at 8% -5%,var(--blob1),transparent 70%),
   radial-gradient(700px 500px at 100% 18%,var(--blob2),transparent 70%),
   radial-gradient(640px 520px at 30% 100%,var(--blob3),transparent 70%),var(--bg);
  background-attachment:fixed;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
button{font:inherit;color:inherit}
button:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1060px;margin:0 auto}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 0;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:21px}
.brand .logo{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:#fff;font-family:var(--f-display);font-weight:800;font-size:15px;
  background:conic-gradient(from 200deg,var(--c-read),var(--c-write),var(--c-listen),var(--c-speak),var(--c-read))}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.stat{display:flex;align-items:center;gap:6px;border-radius:999px;padding:7px 13px;font-size:14px;font-weight:600}
.stat b{font-family:var(--f-mono);font-weight:600;color:var(--ink)}
.stat svg{width:16px;height:16px}
.s-pts{background:var(--c-read-soft);color:var(--c-read)}
.s-fire{background:var(--c-listen-soft);color:var(--c-listen)}
.s-rank{background:var(--c-speak-soft);color:var(--c-speak)}

/* hero */
.hero{display:grid;grid-template-columns:1fr 280px;gap:14px;margin-top:4px}
.hero-main{background:var(--env);color:#fff;border-radius:24px;padding:28px;display:grid;gap:18px;position:relative;overflow:hidden;min-width:0;box-shadow:var(--shadow)}
.hero-main .big-ico{position:absolute;right:-18px;bottom:-26px;width:190px;height:190px;color:rgba(255,255,255,.18)}
.hero-main .big-ico svg{width:100%;height:100%}
.hero-main > *{position:relative}
.pill{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.22);color:#fff;font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;padding:5px 11px;border-radius:99px;width:max-content}
.hero-title{font-size:clamp(34px,6vw,54px);font-weight:800;line-height:1;letter-spacing:-.02em}
.hero-sub{color:rgba(255,255,255,.9);max-width:52ch;margin-top:8px;font-size:16px}
.hbar{height:10px;background:rgba(255,255,255,.28);border-radius:99px;overflow:hidden}
.hbar i{display:block;height:100%;background:#fff;border-radius:99px;transition:width .6s ease}
.hero-meta{display:flex;justify-content:space-between;font-size:13px;color:rgba(255,255,255,.9);margin-bottom:6px}
.hero-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:13px 20px;font-weight:700;cursor:pointer;background:var(--accent);color:var(--accent-ink);transition:transform .12s ease,filter .12s ease}
.btn:hover{filter:brightness(1.07)}.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.4;cursor:not-allowed;filter:none}
.btn.white{background:#fff;color:#1b1630;box-shadow:0 8px 20px -8px rgba(0,0,0,.35)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.good{background:var(--good);color:#fff}
.btn.bad{background:var(--bad);color:#fff}
.side{display:grid;gap:12px;align-content:start}
.tile-stat{background:var(--surface);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow);display:grid;gap:6px}
.tile-stat strong{font-family:var(--f-mono);font-size:18px}
.ring-row{display:flex;align-items:center;gap:14px}
.ring{width:64px;height:64px;flex:none}
.bar{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;transition:width .6s ease}

/* method */
.method{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:26px 0 6px}
.mcard{background:var(--surface);border-radius:var(--r);padding:16px 18px;box-shadow:0 1px 2px rgba(23,20,43,.05)}
.mcard h3{font-size:16px;margin:4px 0}
.mcard p{margin:0;color:var(--muted);font-size:14px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}

/* levels */
.level{margin-top:30px}
.level-band{display:flex;align-items:center;gap:14px;background:var(--env);color:#fff;border-radius:18px;padding:14px 18px;margin-bottom:12px;flex-wrap:wrap}
.level-band .l-ico{width:46px;height:46px;border-radius:14px;background:rgba(255,255,255,.22);display:grid;place-items:center;flex:none}
.level-band .l-ico svg{width:26px;height:26px}
.level-band h2{font-size:clamp(20px,3vw,26px)}
.level-band .l-sub{font-size:14px;color:rgba(255,255,255,.88)}
.level-band .l-txt{flex:1;min-width:0}
.level-band .l-score{font-family:var(--f-mono);font-size:13px;background:rgba(255,255,255,.2);padding:5px 11px;border-radius:99px}
.level.locked .level-band{filter:grayscale(.85);opacity:.55}
.level.locked .gates{opacity:.6}
.gates{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.gate{text-align:left;background:linear-gradient(160deg,var(--gs) 0%,var(--surface) 62%);border:2px solid transparent;border-radius:var(--r);padding:16px;display:grid;gap:10px;cursor:pointer;transition:transform .15s ease,border-color .15s ease,box-shadow .15s ease;min-width:0;box-shadow:0 1px 2px rgba(23,20,43,.05)}
.gate:hover:not([disabled]){transform:translateY(-2px);border-color:var(--gc);box-shadow:var(--shadow)}
.gate[disabled]{cursor:not-allowed;background:var(--surface)}
.gate .g-top{display:flex;justify-content:space-between;align-items:center}
.gate .g-ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--gc);color:#fff;box-shadow:0 6px 14px -6px var(--gc)}
.gate[disabled] .g-ico{background:var(--surface-2);color:var(--muted);box-shadow:none}
.gate .g-ico svg{width:20px;height:20px}
.gate h3{font-size:18px}
.gate p{margin:0;font-size:13px;color:var(--muted)}
.gate.next{border-color:var(--gc);box-shadow:0 0 0 4px var(--gs)}
.tag{font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--gc);color:#fff}
.lock{color:var(--muted)} .lock svg{width:16px;height:16px}
.stars{display:flex;gap:3px}
.stars svg{width:18px;height:18px}
.star-on{fill:var(--gold)} .star-off{fill:var(--line)}

/* lesson overlay: takes the color of its skill */
.lesson{--accent:var(--sk);--accent-soft:var(--sk-soft);--accent-ink:#fff;
  position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;overflow:auto;
  background:radial-gradient(760px 400px at 50% -12%,var(--sk-soft),transparent 75%),var(--bg);
  padding-top:env(safe-area-inset-top,0px)}
.l-top{display:flex;align-items:center;gap:14px;padding:14px max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px));max-width:760px;width:100%;margin:0 auto}
.x{border:0;background:transparent;cursor:pointer;padding:6px;border-radius:8px;color:var(--muted)}
.x svg{width:22px;height:22px}
.l-top .bar{flex:1;height:12px}
.l-top .bar i{background:linear-gradient(90deg,var(--sk),var(--gold))}
.combo{font-family:var(--f-mono);font-size:13px;font-weight:600;color:var(--gold);min-width:64px;text-align:right}
.l-body{flex:1;max-width:760px;width:100%;margin:0 auto;padding:10px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));display:grid;align-content:start;gap:18px}
.l-foot{position:sticky;bottom:0;border-top:1px solid var(--line);background:var(--surface);padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.l-foot.ok{background:var(--good-soft);border-color:var(--good)}
.l-foot.no{background:var(--bad-soft);border-color:var(--bad)}
.l-foot-in{max-width:760px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.fb{min-width:0;flex:1}
.fb h3{font-size:20px}
.l-foot.ok .fb h3{color:var(--good)} .l-foot.no .fb h3{color:var(--bad)}
.fb p{margin:2px 0 0;font-size:14px}
.q-kind{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.skill-badge{display:inline-flex;align-items:center;gap:8px;background:var(--sk);color:#fff;border-radius:99px;padding:5px 12px 5px 6px;font-weight:700;font-size:13px}
.skill-badge i{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.22)}
.skill-badge svg{width:14px;height:14px}
.env-badge{display:inline-flex;align-items:center;gap:6px;background:var(--env);color:#fff;border-radius:99px;padding:5px 12px;font-weight:600;font-size:13px}
.q-title{font-size:clamp(20px,3.6vw,26px);font-weight:700}
.card{background:var(--surface);border-radius:var(--r);padding:18px 20px;box-shadow:var(--shadow)}
.dialog{font-size:18px;line-height:1.65;white-space:pre-line}
.dialog .who{font-family:var(--f-mono);font-size:13px;color:var(--sk);font-weight:600}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 13px;font-size:14px;font-weight:600;cursor:pointer}
.chip svg{width:16px;height:16px;color:var(--sk)}
.chip:hover{border-color:var(--sk)}
.chip .cost{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.translation{color:var(--muted);font-size:15px;border-left:3px solid var(--gold);padding-left:12px;white-space:pre-line}
.prompt{font-size:19px;font-weight:600}
.opts{display:grid;gap:10px}
.opt{text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:14px 16px;font-size:16px;font-weight:500;cursor:pointer;display:flex;gap:12px;align-items:center}
.opt .k{font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);border-radius:6px;padding:1px 7px;color:var(--muted);flex:none}
.opt:hover:not([disabled]){border-color:var(--sk)}
.opt.sel{border-color:var(--sk);background:var(--sk-soft)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.answer-zone{min-height:62px;border-bottom:2px dashed var(--line);display:flex;flex-wrap:wrap;gap:8px;padding:8px 0;align-content:flex-start}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding-top:6px}
.tile{border:1.5px solid var(--line);border-bottom:3px solid var(--sk);background:var(--surface);border-radius:10px;padding:9px 14px;font-size:17px;font-weight:600;cursor:pointer}
.tile:hover{border-color:var(--sk)}
.answer-zone .tile{background:var(--sk-soft);border-color:var(--sk)}
.tile.used{visibility:hidden}
textarea{width:100%;min-height:110px;resize:vertical;border:2px solid var(--line);border-radius:14px;padding:14px;font:inherit;font-size:18px;background:var(--surface);color:var(--ink)}
textarea:focus{outline:none;border-color:var(--sk)}
.play-row{display:flex;gap:14px;justify-content:center;align-items:center;padding:8px 0}
.play{width:92px;height:92px;border-radius:26px;border:0;background:var(--sk);color:#fff;cursor:pointer;display:grid;place-items:center;box-shadow:0 12px 26px -10px var(--sk)}
.play svg{width:40px;height:40px}
.play.slow{width:64px;height:64px;border-radius:18px;background:var(--sk-soft);color:var(--sk);box-shadow:none}
.play.slow svg{width:28px;height:28px}
.subtitle{text-align:center;font-size:18px;font-weight:600}
.speak-phrase{font-family:var(--f-display);font-size:clamp(26px,5vw,36px);font-weight:700;line-height:1.2}
.pron{font-family:var(--f-mono);font-size:15px;color:var(--gold);background:var(--gold-soft);display:inline-block;padding:4px 10px;border-radius:8px}
.mic{width:96px;height:96px;border-radius:50%;border:0;background:var(--bad);color:#fff;cursor:pointer;display:grid;place-items:center;margin:0 auto;box-shadow:0 14px 30px -12px var(--bad)}
.mic svg{width:40px;height:40px}
.mic.on{animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 var(--bad-soft)}70%{box-shadow:0 0 0 22px transparent}100%{box-shadow:0 0 0 0 transparent}}
.heard{text-align:center;color:var(--muted);font-size:15px;min-height:22px}
.self{display:grid;grid-template-columns:1fr 1fr;gap:10px;flex:1;max-width:360px}
.note{font-size:13px;color:var(--muted);text-align:center}
.chunks{display:grid;gap:10px}
.chunk{display:flex;align-items:center;gap:14px;background:var(--surface);border-radius:14px;padding:12px 14px;box-shadow:0 1px 2px rgba(23,20,43,.05)}
.chunk .sp{flex:none;width:44px;height:44px;border-radius:12px;border:0;display:grid;place-items:center;cursor:pointer}
.chunk .sp svg{width:20px;height:20px}
.chunk:nth-child(5n+1) .sp{background:var(--c-read-soft);color:var(--c-read)}
.chunk:nth-child(5n+2) .sp{background:var(--c-write-soft);color:var(--c-write)}
.chunk:nth-child(5n+3) .sp{background:var(--c-listen-soft);color:var(--c-listen)}
.chunk:nth-child(5n+4) .sp{background:var(--c-speak-soft);color:var(--c-speak)}
.chunk:nth-child(5n+5) .sp{background:var(--gold-soft);color:var(--gold)}
.chunk .en{font-weight:700;font-size:17px}
.chunk .pt{color:var(--muted);font-size:14px}
.chunk > div{min-width:0}

/* results */
.result{text-align:center;display:grid;gap:16px;justify-items:center;padding-top:20px}
.big-stars{display:flex;gap:10px}
.big-stars svg{width:60px;height:60px}
.big-stars svg.pop{animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{from{transform:scale(0) rotate(-30deg)}to{transform:scale(1) rotate(0)}}
.res-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:460px}
.res-grid div{border-radius:14px;padding:12px}
.res-grid div:nth-child(1){background:var(--c-speak-soft)}
.res-grid div:nth-child(2){background:var(--gold-soft)}
.res-grid div:nth-child(3){background:var(--c-write-soft)}
.res-grid strong{display:block;font-family:var(--f-mono);font-size:22px}
.res-grid span{font-size:12px;color:var(--muted)}
.seal{display:flex;align-items:center;gap:10px;background:var(--env);color:#fff;border-radius:99px;padding:8px 16px 8px 8px;font-weight:700}
.seal i{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.25);display:grid;place-items:center}
.seal svg{width:20px;height:20px}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:60}
.confetti i{position:absolute;top:-14px;width:9px;height:14px;border-radius:2px;animation:fall 2.4s cubic-bezier(.2,.6,.4,1) forwards}
@keyframes fall{to{transform:translate3d(var(--dx),110vh,0) rotate(var(--rot));opacity:.9}}

.foot-note{margin-top:40px;color:var(--muted);font-size:13px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.linkish{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:13px;padding:0}

/* module picker */
.modules{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:2px 0 14px}
.mod{text-align:left;background:var(--surface);border:2px solid transparent;border-radius:var(--r);padding:14px 16px;display:grid;gap:10px;cursor:pointer;box-shadow:0 1px 2px rgba(23,20,43,.05);transition:border-color .15s ease,transform .15s ease;min-width:0}
.mod:hover:not(.locked){transform:translateY(-1px);border-color:var(--accent)}
.mod.on{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.mod.locked{cursor:not-allowed;opacity:.7}
.mod-top{display:flex;gap:12px;align-items:flex-start}
.mod-top > div{flex:1;min-width:0}
.mod-num{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:20px;color:#fff;
  background:conic-gradient(from 200deg,var(--c-read),var(--c-write),var(--c-listen),var(--c-speak),var(--c-read))}
.mod.locked .mod-num{background:var(--surface-2);color:var(--muted)}
.mod-title{font-family:var(--f-display);font-weight:700;font-size:18px}
.mod-tag{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;background:var(--accent-soft);color:var(--accent);padding:2px 8px;border-radius:99px;vertical-align:middle;margin-left:4px}
.mod-sub{font-size:13px;color:var(--muted)}
.mod .bar i{background:linear-gradient(90deg,var(--c-write),var(--c-read))}
.mod-foot{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.mod-msg{margin:-6px 0 10px;color:var(--c-listen);font-size:14px;font-weight:600;min-height:0}
.mod-msg:empty{display:none}
@media (max-width:620px){.modules{grid-template-columns:1fr}}

/* login */
.login{min-height:100vh;display:grid;place-items:center;padding-block:32px}
.login-card{width:100%;max-width:420px;background:var(--surface);border-radius:24px;box-shadow:var(--shadow);overflow:hidden}
.login-top{background:linear-gradient(125deg,#FF8A3D 0%,#FF4F7B 35%,#8A3FFC 70%,#2F6BFF 100%);color:#fff;padding:28px 26px 24px;display:grid;gap:10px}
.login-top .logo{width:46px;height:46px;border-radius:14px;background:rgba(255,255,255,.25);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:18px}
.login-top h1{font-size:30px;font-weight:800}
.login-top p{margin:0;color:rgba(255,255,255,.9);font-size:15px}
.login-form{padding:24px 26px 26px;display:grid;gap:14px}
.login-form label{display:grid;gap:6px;font-weight:600;font-size:14px}
.login-form input{border:2px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit;font-size:16px;background:var(--surface);color:var(--ink)}
.login-form input:focus{outline:none;border-color:var(--accent)}
.login-err{color:var(--bad);font-size:14px;min-height:20px;margin:0}
.login-form .btn{width:100%;background:linear-gradient(125deg,#8A3FFC,#2F6BFF);color:#fff;padding:14px}
.login-hint{font-size:13px;color:var(--muted);text-align:center;margin:0}
.who-chip{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600}
.who-chip .av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:13px;font-weight:700;background:conic-gradient(from 200deg,var(--c-read),var(--c-write),var(--c-listen),var(--c-speak),var(--c-read))}
.top-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}

@media (max-width:820px){
  .hero{grid-template-columns:1fr}
  .side{grid-template-columns:repeat(3,1fr)}
  .gates{grid-template-columns:repeat(2,1fr)}
  .method{grid-template-columns:1fr;gap:10px}
}
@media (max-width:560px){.side{grid-template-columns:1fr}}
@media (max-width:420px){.gate{padding:13px}.gate h3{font-size:16px}.hero-main{padding:22px 18px}.level-band .l-score{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

 phases:{

  items:[
  {t:"read",text:"A: How was your weekend?\nB: Great! My whole family got together for my grandma's birthday.\nA: Nice! How old is she now?\nB: Eighty-five, and she still dances better than all of us!",pt:"A: Como foi seu fim de semana?\nB: Ótimo! A família toda se reuniu no aniversário da minha avó.\nA: Que legal! Quantos anos ela tem agora?\nB: Oitenta e cinco, e ainda dança melhor que todos nós!",q:"O que aconteceu no fim de semana?",o:["A família se reuniu no aniversário da avó","A avó viajou com a família","B dançou numa festa do trabalho","A família levou a avó ao médico"],a:0},
  {t:"read",text:"My son looks like his dad, but he has my eyes. He's tall for his age and very shy.",pt:"Meu filho é parecido com o pai, mas tem os meus olhos. Ele é alto para a idade e muito tímido.",q:"Como é o filho?",o:["Alto para a idade e tímido","Baixo e extrovertido","Parecido só com a mãe","Tem os olhos do pai"],a:0},
  {t:"read",text:"When I was a kid, we used to spend every summer at my uncle's farm. We swam in the river and rode horses.",pt:"Quando eu era criança, passávamos todo verão na fazenda do meu tio. Nadávamos no rio e andávamos a cavalo.",q:"O que faziam no verão?",o:["Iam à fazenda do tio","Viajavam para a praia","Ficavam em casa","Trabalhavam na cidade"],a:0},
  {t:"read",text:"A: Did you call your mom yesterday?\nB: No, I forgot. I'll call her tonight.\nA: Don't forget again!\nB: I won't, I promise.",pt:"A: Você ligou para sua mãe ontem?\nB: Não, esqueci. Vou ligar para ela hoje à noite.\nA: Não esqueça de novo!\nB: Não vou esquecer, prometo.",q:"Quando B vai ligar para a mãe?",o:["Hoje à noite","Ontem","Amanhã de manhã","Não vai ligar"],a:0},
  {t:"read",text:"My sister moved to Portugal last year. She works as a nurse there, and we talk on video every Sunday.",pt:"Minha irmã se mudou para Portugal no ano passado. Ela trabalha como enfermeira lá, e conversamos por vídeo todo domingo.",q:"Como falam com a irmã?",o:["Por vídeo, todo domingo","Por carta, todo mês","Só no Natal","Por telefone, todo dia"],a:0},
  {t:"read",text:"A: Who's that in the photo?\nB: That's my cousin Rita. She's the one with curly hair.\nA: She looks just like you!\nB: Everybody says that.",pt:"A: Quem é essa na foto?\nB: É minha prima Rita. É aquela de cabelo cacheado.\nA: Ela é a sua cara!\nB: Todo mundo diz isso.",q:"O que A achou da prima?",o:["Muito parecida com B","Mais velha que B","Bem diferente de B","Mais alta que B"],a:0},
 ]},

  items:[
  {t:"read",text:"A: Which one is better?\nB: This one is cheaper, but that one is better quality.\nA: Is it worth paying more?\nB: Honestly, yes. It lasts much longer.",pt:"A: Qual é melhor?\nB: Este é mais barato, mas aquele tem mais qualidade.\nA: Vale a pena pagar mais?\nB: Sinceramente, sim. Dura muito mais.",q:"O que B recomenda?",o:["Pagar mais pelo de melhor qualidade","Comprar o mais barato","Não comprar nenhum","Esperar uma promoção"],a:0},
  {t:"read",text:"I bought a phone online last week. It arrived yesterday, but the screen was damaged.",pt:"Comprei um celular pela internet semana passada. Chegou ontem, mas a tela estava danificada.",q:"Qual foi o problema?",o:["A tela chegou danificada","O celular não chegou","Chegou o modelo errado","A bateria não carrega"],a:0},
  {t:"read",text:"A: Hi, I bought this blender here on Monday, and it doesn't work.\nB: I'm sorry about that. Would you like a replacement or a refund?\nA: A refund, please.",pt:"A: Oi, comprei este liquidificador aqui na segunda e ele não funciona.\nB: Sinto muito. Você prefere trocar ou receber o dinheiro de volta?\nA: O dinheiro de volta, por favor.",q:"O que o cliente escolheu?",o:["O dinheiro de volta","Trocar por outro","Mandar consertar","Um desconto"],a:0},
  {t:"read",text:"Free shipping on orders over 100 dollars. Delivery in 3 to 5 business days.",pt:"Frete grátis em pedidos acima de 100 dólares. Entrega em 3 a 5 dias úteis.",q:"Quando o frete é grátis?",o:["Em compras acima de US$ 100","Em qualquer compra","Só com entrega em 3 dias","Nunca"],a:0},
  {t:"read",text:"A: These shoes are too tight. Do you have a bigger size?\nB: We're out of size 42, but we can order it for you.\nA: How long will it take?\nB: About a week.",pt:"A: Estes sapatos estão apertados. Tem um número maior?\nB: Estamos sem o 42, mas podemos encomendar para você.\nA: Quanto tempo vai levar?\nB: Mais ou menos uma semana.",q:"Quanto tempo para chegar o 42?",o:["Cerca de uma semana","Amanhã","Um mês","Não vai chegar"],a:0},
  {t:"read",text:"I usually compare prices on three websites before I buy anything. Last month I saved almost 200 reais on a TV.",pt:"Eu geralmente comparo preços em três sites antes de comprar qualquer coisa. Mês passado economizei quase 200 reais numa TV.",q:"Quanto ela economizou na TV?",o:["Quase 200 reais","Quase 300 reais","Nada","Mais de 500 reais"],a:0},

const normUser=s=>s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().trim().replace(/\s+/g," ");
async function sha256(t){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");}
const SESSION="ingles-acelerado-sessao";
let USER=null;

/* ---------- state (saved in this browser, one area per user) ---------- */
const KEY="ingles-acelerado-v1";
const blank=()=>({xp:0,stars:{},streak:0,last:"",today:{d:"",xp:0}});
let S=blank();
function loadState(){S=blank();try{const raw=localStorage.getItem(KEY+":"+USER.id);if(raw)S=Object.assign(S,JSON.parse(raw));}catch(e){}touchDay();
  M=+S.mod||0;if(!MODULES[M]||!moduleOpen(M))M=0;}
function save(){if(!USER)return;try{localStorage.setItem(KEY+":"+USER.id,JSON.stringify(S));}catch(e){}}
const dayStr=d=>d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();
const today=()=>dayStr(new Date());
function touchDay(){const t=today();if(S.today.d!==t)S.today={d:t,xp:0};}
touchDay();
function addXP(n){touchDay();S.xp+=n;S.today.xp+=n;const t=today();
  if(S.last!==t){const y=new Date();y.setDate(y.getDate()-1);S.streak=(S.last===dayStr(y))?S.streak+1:1;S.last=t;}save();}
/* modules: M is the open module. Module 1 keeps the original keys ("0-1"); Module 2 uses "m2:0-1" */
let M=0;
const LV=()=>MODULES[M].levels;
const sk=(l,s)=>(M===0?"":"m"+(M+1)+":")+l+"-"+s;
const starsM=(m,l,s)=>S.stars[(m===0?"":"m"+(m+1)+":")+l+"-"+s]||0;
const moduleStars=m=>MODULES[m].levels.reduce((a,L,l)=>a+SKILLS.reduce((b,s,i)=>b+starsM(m,l,i),0),0);
const moduleMax=m=>MODULES[m].levels.length*12;
const moduleDone=m=>MODULES[m].levels.every((L,l)=>SKILLS.every((s,i)=>starsM(m,l,i)>0));
const moduleOpen=m=>m===0||moduleDone(m-1)||!!(USER&&USER.admin);
const starsOf=(l,s)=>S.stars[sk(l,s)]||0;
const levelDone=l=>SKILLS.every((s,i)=>starsOf(l,i)>0);
const levelOpen=l=>l===0||levelDone(l-1);
const phaseOpen=(l,s)=>levelOpen(l)&&(s===0||starsOf(l,s-1)>0);
const levelStars=l=>SKILLS.reduce((a,s,i)=>a+starsOf(l,i),0);
const rank=xp=>{let r=RANKS[0];RANKS.forEach(x=>{if(xp>=x[0])r=x;});return r;};
const nextRank=xp=>RANKS.find(x=>x[0]>xp);
function current(){for(let l=0;l<LV().length;l++){if(!levelOpen(l))break;for(let s=0;s<4;s++){if(starsOf(l,s)===0)return [l,s];}}return null;}

/* ---------- audio ---------- */
const synth=window.speechSynthesis;let voice=null;
function pickVoice(){if(!synth)return;const vs=synth.getVoices();
  voice=vs.find(v=>/en-US/i.test(v.lang)&&/Samantha|Google US|Aria|Jenny|Natural/i.test(v.name))||vs.find(v=>/en-US/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null;}
if(synth){pickVoice();try{synth.addEventListener("voiceschanged",pickVoice);}catch(e){synth.onvoiceschanged=pickVoice;}}
function say(text,slow){if(!synth){noAudio();return;}try{synth.cancel();const u=new SpeechSynthesisUtterance(text.replace(/^[AB]: /gm,""));
  u.lang="en-US";if(voice)u.voice=voice;u.rate=slow?0.62:0.92;synth.speak(u);}catch(e){noAudio();}}
function noAudio(){const n=document.querySelector("#lesson .note.audio");if(n)n.hidden=false;}

/* ---------- utils ---------- */
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const norm=s=>s.toLowerCase().replace(/[’‘]/g,"'").replace(/[^a-z0-9'ãáâéêíóôõúç ]/g," ").replace(/\s+/g," ").trim();
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmtDialog=t=>esc(t).replace(/^([AB]):/gm,'<span class="who">$1</span>');
const ring=(pct,col)=>{const r=26,c=2*Math.PI*r;return `<svg class="ring" viewBox="0 0 64 64"><circle cx="32" cy="32" r="${r}" fill="none" stroke="var(--surface-2)" stroke-width="8"/><circle cx="32" cy="32" r="${r}" fill="none" stroke="${col}" stroke-width="8" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-pct)}" transform="rotate(-90 32 32)"/></svg>`;};

    enter(found);};

function enter(u){
  USER=u;

  try{if(u===USERS[0]&&!localStorage.getItem(KEY+":"+u.id)){const old=localStorage.getItem(KEY);if(old)localStorage.setItem(KEY+":"+u.id,old);}}catch(x){}
  loadState();loginBox.hidden=true;loginBox.innerHTML="";home.hidden=false;renderHome();window.scrollTo(0,0);
}
function logout(){try{localStorage.removeItem(SESSION);}catch(x){}USER=null;S=blank();home.innerHTML="";renderLogin();}

let R=null;
function startPhase(l,s){
  R={l,s,P:LV()[l].phases[SKILLS[s].key],i:0,correct:0,combo:0,best:0,earned:0,help:false,picked:null,built:[],done:false,wasLevelDone:levelDone(l),wasModuleDone:moduleDone(M)};

function closeLesson(){if(synth)try{synth.cancel();}catch(e){}stopMic();box.hidden=true;document.body.style.overflow="";R=null;renderHome();window.scrollTo(0,0);}
function frame(body,foot,progress){

const badges=()=>`<span class="skill-badge"><i>${SKILLS[R.s].ico}</i>${SKILLS[R.s].name}</span><span class="env-badge">${MODULES[M].title} · Nível ${R.l+1} · ${LV()[R.l].env}</span>`;

  document.getElementById("startq").onclick=renderItem;

function renderItem(){
  const it=R.P.items[R.i];Object.assign(R,{help:false,picked:null,built:[],done:false});

    body+=`<h2 class="q-title">Leia e responda</h2>

  }else{
    body+=`<h2 class="q-title">Ouça e fale em voz alta</h2>

function optsHTML(it){return `<div class="opts" role="radiogroup">${it.o.map((o,i)=>`<button class="opt" role="radio" aria-checked="false" data-i="${i}"><span class="k">${i+1}</span>${esc(o)}</button>`).join("")}</div>`;}
function buildHTML(it){const tiles=shuffle(it.ans.concat(it.x).map((w,i)=>({w,i})));
  return `<div class="answer-zone" id="az" aria-label="Sua frase"></div><div class="bank" id="bank">${tiles.map(t=>`<button class="tile" data-i="${t.i}">${esc(t.w)}</button>`).join("")}</div>`;}
function wire(it){
  const $=id=>document.getElementById(id);const check=$("check"),skip=$("skip");
  const useHelp=(btn,el)=>{if(!btn)return;btn.onclick=()=>{el.hidden=!el.hidden;R.help=true;const c=btn.querySelector(".cost");if(c)c.textContent="usada";};};
  if($("hear"))$("hear").onclick=()=>say(it.text);
  useHelp($("tr"),$("trt"));useHelp($("sub"),$("subt"));
  if($("hint")){$("hintt").textContent=it.show.split(" ").slice(0,2).join(" ")+" ...";useHelp($("hint"),$("hintt"));}
  if($("pl"))$("pl").onclick=()=>say(it.say||it.en);
  if($("ps"))$("ps").onclick=()=>say(it.say||it.en,true);
  box.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(R.done)return;box.querySelectorAll(".opt").forEach(x=>{x.classList.remove("sel");x.setAttribute("aria-checked","false");});
    b.classList.add("sel");b.setAttribute("aria-checked","true");R.picked=+b.dataset.i;check.disabled=false;});
  const bank=$("bank"),az=$("az");
  if(bank){const all=it.ans.concat(it.x);
    const redraw=()=>{az.innerHTML=R.built.map((ti,k)=>`<button class="tile" data-k="${k}">${esc(all[ti])}</button>`).join("");
      bank.querySelectorAll(".tile").forEach(t=>t.classList.toggle("used",R.built.includes(+t.dataset.i)));
      az.querySelectorAll(".tile").forEach(t=>t.onclick=()=>{if(R.done)return;R.built.splice(+t.dataset.k,1);redraw();});
      check.disabled=R.built.length===0;};
    bank.querySelectorAll(".tile").forEach(t=>t.onclick=()=>{if(R.done||t.classList.contains("used"))return;R.built.push(+t.dataset.i);if(it.t!=="lbuild")say(all[+t.dataset.i]);redraw();});
  }
  const ta=$("ta");if(ta){ta.oninput=()=>{check.disabled=ta.value.trim().length===0;};setTimeout(()=>ta.focus(),50);
    ta.onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();if(!check.disabled)check.click();}};}
  if(check)check.onclick=()=>{let ok=false,answer="";
    if(it.o){ok=R.picked===it.a;answer=it.o[it.a];
      box.querySelectorAll(".opt").forEach((x,i)=>{x.disabled=true;if(i===it.a)x.classList.add("right");else if(i===R.picked)x.classList.add("wrong");});}
    else if(it.ans){const all=it.ans.concat(it.x);ok=norm(R.built.map(i=>all[i]).join(" "))===norm(it.ans.join(" "));answer=it.ans.join(" ");}
    else{ok=it.acc.map(norm).includes(norm(ta.value));answer=it.show;ta.disabled=true;}
    finish(ok,answer,it);};
  if(skip)skip.onclick=()=>finish(false,it.o?it.o[it.a]:(it.ans?it.ans.join(" "):it.show),it,true);
  if($("selfok"))$("selfok").onclick=()=>finish(true,"",it);
  if($("selfno"))$("selfno").onclick=()=>finish(false,"",it,false,true);
  if($("mic"))$("mic").onclick=()=>listenMic(it);
}
let rec=null;
function stopMic(){if(rec){try{rec.abort();}catch(e){}rec=null;}}
function listenMic(it){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;const heard=document.getElementById("heard"),mic=document.getElementById("mic");
  if(!SR){heard.textContent="Este navegador não reconhece fala. Use o Google Chrome, ou fale em voz alta e avalie abaixo.";return;}
  if(rec){stopMic();mic.classList.remove("on");return;}
  try{if(synth)synth.cancel();rec=new SR();rec.lang="en-US";rec.interimResults=false;rec.maxAlternatives=3;
    mic.classList.add("on");heard.textContent="Ouvindo... fale agora.";
    rec.onresult=e=>{const alts=[...e.results[0]].map(a=>a.transcript);const target=norm(it.en).split(" ");
      let best=0,bestT=alts[0]||"";alts.forEach(t=>{const w=norm(t).split(" ");const hit=target.filter(x=>w.includes(x)).length/target.length;if(hit>best){best=hit;bestT=t;}});
      heard.textContent=`Entendi: “${bestT}” · ${Math.round(best*100)}% da frase${best>=0.7?"":" · tente de novo"}`;mic.classList.remove("on");rec=null;
      if(best>=0.7)setTimeout(()=>finish(true,"",it),700);};
    rec.onerror=ev=>{mic.classList.remove("on");rec=null;heard.textContent=(ev.error==="not-allowed"||ev.error==="service-not-allowed")?"O microfone foi bloqueado. Libere no cadeado da barra de endereço, ou fale em voz alta e avalie abaixo.":"Não consegui ouvir. Tente de novo ou avalie você mesmo abaixo.";};
    rec.onend=()=>{mic.classList.remove("on");rec=null;};
    rec.start();
  }catch(e){mic.classList.remove("on");rec=null;heard.textContent="O microfone não está disponível aqui. Fale em voz alta e avalie você mesmo abaixo.";}
}
function finish(ok,answer,it,skipped,practice){
  if(R.done)return;R.done=true;stopMic();
  let pts=0;
  if(ok){R.correct++;R.combo++;R.best=Math.max(R.best,R.combo);pts=R.help?6:10;if(R.combo>=3)pts+=5;R.earned+=pts;}else R.combo=0;
  const lf=document.getElementById("lf"),lfi=document.getElementById("lfi");lf.className="l-foot "+(ok?"ok":"no");
  const heading=ok?(R.combo>=3?"Excelente! "+R.combo+" seguidas":R.help?"Correto, com ajuda":"Correto!"):practice?"Continue treinando":skipped?"Pulada":"Quase lá";
  const msg=ok?`+${pts} pontos${R.combo>=3?" (bônus de sequência)":""}`:answer?`Resposta: <strong>${esc(answer)}</strong>`:"Ouça mais uma vez e repita devagar, depois no ritmo normal.";
  lfi.innerHTML=`<div class="fb"><h3>${heading}</h3><p>${msg}</p></div><button class="btn ${ok?"good":"bad"}" id="next">Continuar</button>`;
  if(!ok&&it.t!=="read")say(it.say||it.en||it.show||it.ans.join(" "));
  document.getElementById("combo").textContent=R.combo>=2?"🔥 ×"+R.combo:"";
  const n=document.getElementById("next");n.focus();n.onclick=()=>{R.i++;if(R.i<R.P.items.length)renderItem();else renderResult();};
}
function renderResult(){
  const n=R.P.items.length,c=R.correct,stars=starsFor(c,n),prev=starsOf(R.l,R.s);
  const bonus=Math.max(0,stars-prev)*15,total=R.earned+bonus;
  if(total>0)addXP(total);
  if(stars>prev){S.stars[sk(R.l,R.s)]=stars;save();}
  const newLevel=levelDone(R.l)&&!R.wasLevelDone,newModule=moduleDone(M)&&!R.wasModuleDone,L=LV()[R.l],nextL=LV()[R.l+1],nextM=MODULES[M+1];
  let title,sub;
  if(stars===0){title="Ainda não foi desta vez";sub=`Você acertou ${c} de ${n}. Ouça os blocos de novo e tente outra vez: são precisos ${passFor(n)} acertos.`;}
  else if(newModule){title=`${MODULES[M].title} concluído!`;sub=nextM?`Você passou pelos 5 ambientes. O ${nextM.title} está liberado: os mesmos ambientes, com conteúdo novo e um passo acima.`:"Você completou todos os módulos disponíveis. Novos módulos chegam em breve.";}
  else if(newLevel){title=`Nível ${R.l+1} concluído!`;sub=nextL?`Você dominou o ambiente ${L.env}. Liberado: Nível ${R.l+2}, ambiente ${nextL.env}.`:"Você completou todos os ambientes deste módulo.";}
  else{title=stars===3?"Fase perfeita!":"Fase concluída!";sub=R.s<3?`Próxima fase liberada: ${SKILLS[R.s+1].name}.`:"Continue para fechar o nível.";}
  frame(`<div class="result">
    ${newModule?`<div class="seal"><i>${I.badge}</i>Selo ${MODULES[M].title}</div>`:newLevel?`<div class="seal"><i>${L.ico}</i>Selo ${L.env}</div>`:""}
    <div class="big-stars">${[0,1,2].map(i=>star(i<stars,i<stars?"pop":"").replace('class="pop"',`class="pop" style="animation-delay:${i*.18}s"`)).join("")}</div>
    <h2 class="q-title">${title}</h2><p style="margin:0;color:var(--muted);max-width:46ch">${sub}</p>
    <div class="res-grid"><div><strong>${c}/${n}</strong><span>acertos</span></div><div><strong>+${total}</strong><span>pontos</span></div><div><strong>${R.best}</strong><span>maior sequência</span></div></div>
    ${bonus?`<p class="note">Inclui +${bonus} pontos por estrelas novas.</p>`:""}
  </div>`,
  `<button class="btn ghost" id="again">Refazer fase</button><button class="btn ${stars?"":"ghost"}" id="cont">${stars?"Voltar aos níveis":"Voltar"}</button>`,100);
  if(stars>0)confetti(newModule?140:newLevel?90:50);
  document.getElementById("again").onclick=()=>startPhase(R.l,R.s);
  document.getElementById("cont").onclick=closeLesson;
}
function confetti(n){
  try{if(window.matchMedia("(prefers-reduced-motion: reduce)").matches)return;}catch(e){}
  const cs=getComputedStyle(document.documentElement);
  const cols=["--c-read","--c-write","--c-listen","--c-speak","--gold"].map(v=>cs.getPropertyValue(v).trim()||"#FF7A1A");
  const wrap=document.createElement("div");wrap.className="confetti";
  for(let i=0;i<n;i++){const p=document.createElement("i");p.style.left=(Math.random()*100)+"%";p.style.background=cols[i%cols.length];
    p.style.setProperty("--dx",(Math.random()*160-80)+"px");p.style.setProperty("--rot",(Math.random()*720-360)+"deg");
    p.style.animationDelay=(Math.random()*.5)+"s";if(i%3===0)p.style.borderRadius="50%";wrap.appendChild(p);}
  document.body.appendChild(wrap);setTimeout(()=>wrap.remove(),3200);
}
document.addEventListener("keydown",e=>{
  if(box.hidden||!R)return;
  if(e.key==="Escape"){closeLesson();return;}
  if(e.target.tagName==="TEXTAREA")return;
  if(/^[1-4]$/.test(e.key)){const b=box.querySelector(`.opt[data-i="${+e.key-1}"]`);if(b&&!b.disabled)b.click();}
  if(e.key==="Enter"){const n=document.getElementById("next")||document.getElementById("check")||document.getElementById("startq");if(n&&!n.disabled&&document.activeElement!==n){e.preventDefault();n.click();}}
});
(function boot(){let id=null;try{id=localStorage.getItem(SESSION);}catch(e){}
  const u=USERS.find(x=>x.id===id);if(u)enter(u);else renderLogin();})();
})();
</script>
